# Lumina Lock drop-in for dde-session's dde-lock.service (user unit).
#
# dde-lock.service is owned by the dde-session package and starts the lock
# resident at session init. Lumina Lock is a long-running QGuiApplication that
# does not fork, so the unit's Type=forking would hang the session start job
# forever (TimeoutStartSec=infinity). We override:
#   - Type=simple      -> systemd considers the service started once exec'd
#   - ExecStart        -> explicit daemon mode + the dde-lock PAM service
#
# The D-Bus activation path (org.deepin.dde.LockFront1 -> SystemdService
# dde-lock.service) and the lock-on-demand path (dde-daemon calling
# LockFront1.Show()) both route through this unit and therefore through
# Lumina Lock once the /usr/bin/dde-lock takeover is in place.

[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/dde-lock --daemon --pam-service dde-lock
